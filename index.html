<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Little World — Puzzle</title>
<style>
  :root{
    --bg-0:#0a0a12;
    --bg-1:#12121e;
    --glass:rgba(255,255,255,0.06);
    --glass-border:rgba(255,255,255,0.12);
    --cyan:#5eead4;
    --pink:#f472b6;
    --text:#f1f1f6;
    --text-dim:#9a9ab0;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:
      radial-gradient(circle at 15% 10%, rgba(94,234,212,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(244,114,182,0.12), transparent 45%),
      var(--bg-0);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}

  /* ---------- Shared UI ---------- */
  .glass{
    background:var(--glass);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-border);
    border-radius:var(--radius);
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 22px; border-radius:14px; border:none; cursor:pointer;
    font-size:15px; font-weight:600; letter-spacing:.2px;
    background:linear-gradient(135deg,var(--cyan),var(--pink));
    color:#0a0a12; transition:transform .15s ease, filter .15s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn.secondary{
    background:var(--glass); color:var(--text); border:1px solid var(--glass-border);
  }
  input[type=text], input[type=file]{
    width:100%; padding:14px 16px; border-radius:12px;
    border:1px solid var(--glass-border); background:rgba(255,255,255,0.04);
    color:var(--text); font-size:15px; outline:none;
  }
  input[type=text]:focus{border-color:var(--cyan);}
  .label{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:8px; display:block;}

  /* ---------- Landing ---------- */
  #screen-landing{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; gap:28px; text-align:center;
  }
  .title{font-size:34px; font-weight:800; letter-spacing:-0.5px;}
  .title span{background:linear-gradient(135deg,var(--cyan),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .subtitle{color:var(--text-dim); font-size:15px; max-width:320px;}
  .card{padding:28px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:14px;}
  .divider{display:flex; align-items:center; gap:10px; color:var(--text-dim); font-size:12px; margin:4px 0;}
  .divider::before,.divider::after{content:''; flex:1; height:1px; background:var(--glass-border);}

  /* ---------- Lobby ---------- */
  #screen-lobby{flex:1; display:flex; flex-direction:column; padding:20px; gap:16px; overflow-y:auto;}
  .room-code-pill{
    align-self:center; padding:10px 20px; font-size:22px; font-weight:800; letter-spacing:4px;
    border-radius:14px; background:var(--glass); border:1px solid var(--glass-border);
  }
  .presence-row{display:flex; gap:10px; justify-content:center;}
  .presence-chip{
    display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:100px;
    font-size:13px; font-weight:600; background:var(--glass); border:1px solid var(--glass-border);
  }
  .dot{width:8px; height:8px; border-radius:50%;}
  .dot.on{background:#4ade80; box-shadow:0 0 8px #4ade80;}
  .dot.off{background:#6b6b7d;}
  .upload-zone{
    border:2px dashed var(--glass-border); border-radius:var(--radius); padding:30px 20px;
    text-align:center; cursor:pointer; position:relative; overflow:hidden;
  }
  .upload-zone img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.4;}
  .upload-zone .ph{position:relative; z-index:1;}
  .diff-row{display:flex; gap:10px;}
  .diff-btn{
    flex:1; padding:12px 8px; border-radius:12px; border:1px solid var(--glass-border);
    background:var(--glass); color:var(--text-dim); font-size:13px; font-weight:600; cursor:pointer;
  }
  .diff-btn.active{border-color:var(--cyan); color:var(--cyan); background:rgba(94,234,212,0.08);}

  /* ---------- Puzzle Board ---------- */
  #screen-puzzle{flex:1; display:flex; flex-direction:column; position:relative;}
  #topbar{
    display:flex; align-items:center; justify-content:space-between; padding:10px 14px; gap:10px; z-index:20;
  }
  #progress-pill{padding:8px 16px; border-radius:100px; font-size:13px; font-weight:700;}
  #board-viewport{
    flex:1; position:relative; overflow:hidden;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 40px),
      radial-gradient(circle at 50% 50%, #17172a, #0a0a12);
  }
  #board-canvas{position:absolute; top:0; left:0; transform-origin:0 0;}
  .piece{
    position:absolute; cursor:grab; will-change:transform;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }
  .piece.held{filter:drop-shadow(0 6px 16px rgba(0,0,0,0.7)) drop-shadow(0 0 0 3px var(--holder-color, var(--cyan))); z-index:50;}
  .piece.mine-dragging{z-index:60; cursor:grabbing;}
  .piece-label{
    position:absolute; top:-22px; left:0; font-size:10px; font-weight:700; padding:2px 8px;
    border-radius:100px; color:#0a0a12; white-space:nowrap; pointer-events:none;
  }
  .cursor{position:absolute; pointer-events:none; z-index:80; transition:left .08s linear, top .08s linear;}
  .cursor-tag{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px; color:#0a0a12;
    transform:translate(10px, -4px); white-space:nowrap; display:inline-block;
  }
  #zoom-controls{position:absolute; bottom:16px; right:16px; display:flex; flex-direction:column; gap:8px; z-index:30;}
  #zoom-controls button{
    width:42px; height:42px; border-radius:12px; border:1px solid var(--glass-border);
    background:var(--glass); color:var(--text); font-size:18px; font-weight:700;
  }
  #reveal-overlay{
    position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
    background:rgba(5,5,10,0.85); backdrop-filter:blur(10px); flex-direction:column; gap:20px; padding:24px; text-align:center;
  }
  #reveal-overlay img{max-width:min(90vw,500px); max-height:50vh; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.6);}
  #reveal-msg{font-size:18px; max-width:400px; color:var(--text);}
  .confetti{position:fixed; top:-10px; z-index:210; pointer-events:none; border-radius:2px;}
  .hidden{display:none !important;}
  #msg-input-wrap{display:none; flex-direction:column; gap:8px;}
</style>
</head>
<body>
<div id="app">

  <!-- ============ LANDING ============ -->
  <div id="screen-landing">
    <div>
      <div class="title">❤️ <span>Our Little World</span></div>
      <p class="subtitle">Do things together, even when you're apart.</p>
    </div>
    <div class="card glass">
      <label class="label">Tu nombre</label>
      <input type="text" id="input-name" placeholder="¿Cómo te llamas?" maxlength="18">
      <button class="btn" id="btn-create-room">🧩 Crear una sala</button>
      <div class="divider">o</div>
      <input type="text" id="input-code" placeholder="Código de sala (ej. A7K92)" maxlength="6" style="text-transform:uppercase; text-align:center; letter-spacing:3px;">
      <button class="btn secondary" id="btn-join-room">Unirme a la sala</button>
    </div>
  </div>

  <!-- ============ LOBBY ============ -->
  <div id="screen-lobby" class="hidden">
    <div class="room-code-pill" id="lobby-code">------</div>
    <div class="presence-row" id="lobby-presence"></div>

    <div class="glass" style="padding:18px;">
      <label class="label">Foto del puzzle</label>
      <label class="upload-zone" id="upload-zone">
        <img id="upload-preview" class="hidden">
        <div class="ph" id="upload-placeholder">📷<br><span style="font-size:13px; color:var(--text-dim)">Toca para subir una foto</span></div>
        <input type="file" id="input-file" accept="image/*" class="hidden">
      </label>
    </div>

    <div class="glass" style="padding:18px;">
      <label class="label">Dificultad</label>
      <div class="diff-row">
        <button class="diff-btn" data-r="3" data-c="4">Fácil · 12</button>
        <button class="diff-btn active" data-r="4" data-c="6">Media · 24</button>
        <button class="diff-btn" data-r="6" data-c="8">Difícil · 48</button>
      </div>
    </div>

    <div class="glass" style="padding:18px;">
      <label class="label">Mensaje al terminar (opcional)</label>
      <input type="text" id="input-message" placeholder="Un mensaje que aparecerá al completar el puzzle" maxlength="120">
    </div>

    <button class="btn" id="btn-start-puzzle" style="margin-top:4px;">Empezar puzzle 🧩</button>
  </div>

  <!-- ============ PUZZLE BOARD ============ -->
  <div id="screen-puzzle" class="hidden">
    <div id="topbar">
      <div class="presence-row" id="board-presence"></div>
      <div id="progress-pill" class="glass">0/0 piezas</div>
    </div>
    <div id="board-viewport">
      <div id="board-canvas"></div>
      <div id="cursors-layer"></div>
    </div>
    <div id="zoom-controls">
      <button id="zoom-in">+</button>
      <button id="zoom-fit">⤢</button>
      <button id="zoom-out">−</button>
    </div>
  </div>

  <div id="reveal-overlay">
    <div style="font-size:40px;">🎉</div>
    <img id="reveal-img">
    <div id="reveal-msg"></div>
    <button class="btn secondary" onclick="document.getElementById('reveal-overlay').style.display='none'">Cerrar</button>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ============================================================
   FIREBASE CONFIG — reemplaza con la config de TU proyecto
   Firebase Console > Configuración del proyecto > Tus apps > SDK config
   Activa Realtime Database (no Firestore) y usa estas reglas de ejemplo:

   {
     "rules": {
       "rooms": {
         "$roomId": {
           ".read": true,
           ".write": true,
           ".validate": "$roomId.length == 5"
         }
       }
     }
   }
   (Es un MVP: reglas abiertas por código de sala de 5 chars, sin datos
   sensibles. Antes de tener tráfico público, añade auth anónima real.)
============================================================ */
const firebaseConfig = {
  apiKey: "REEMPLAZA_TU_API_KEY",
  authDomain: "REEMPLAZA.firebaseapp.com",
  databaseURL: "https://REEMPLAZA-default-rtdb.firebaseio.com",
  projectId: "REEMPLAZA",
  storageBucket: "REEMPLAZA.appspot.com",
  messagingSenderId: "REEMPLAZA",
  appId: "REEMPLAZA"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================================
   STATE / IDENTITY
============================================================ */
const MY_UID = localStorage.getItem('olw_uid') || (()=>{
  const id = 'u_' + Math.random().toString(36).slice(2,10);
  localStorage.setItem('olw_uid', id);
  return id;
})();
let MY_NAME = localStorage.getItem('olw_name') || '';
let MY_COLOR = null; // asignado al entrar a la sala (cyan / pink)
let ROOM_CODE = null;
let roomRef = null;

const CANVAS_W = 1200, CANVAS_H = 800; // sistema de coordenadas lógico, independiente del dispositivo

/* ============================================================
   UTILS
============================================================ */
function $(id){ return document.getElementById(id); }
function showScreen(id){
  ['screen-landing','screen-lobby','screen-puzzle'].forEach(s=>{
    $(s).classList.toggle('hidden', s !== id);
  });
}
function genRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
// PRNG determinista (mulberry32) — misma semilla = mismos resultados en ambos clientes
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i)) | 0; }
  return h;
}
function throttle(fn, ms){
  let last = 0, pending = null;
  return (...args) => {
    const now = performance.now();
    if(now - last >= ms){ last = now; fn(...args); }
    else{
      clearTimeout(pending);
      pending = setTimeout(()=>{ last = performance.now(); fn(...args); }, ms - (now-last));
    }
  };
}

/* ============================================================
   LANDING SCREEN
============================================================ */
$('input-name').value = MY_NAME;

$('btn-create-room').onclick = async () => {
  MY_NAME = $('input-name').value.trim() || 'Yo';
  localStorage.setItem('olw_name', MY_NAME);
  const code = genRoomCode();
  await enterRoom(code, true);
};
$('btn-join-room').onclick = async () => {
  MY_NAME = $('input-name').value.trim() || 'Yo';
  localStorage.setItem('olw_name', MY_NAME);
  const code = $('input-code').value.trim().toUpperCase();
  if(code.length < 4){ alert('Introduce un código de sala válido'); return; }
  await enterRoom(code, false);
};

/* ============================================================
   ROOM / PRESENCE
============================================================ */
async function enterRoom(code, isCreator){
  ROOM_CODE = code;
  roomRef = db.ref('rooms/' + code);

  const presenceRef = roomRef.child('presence/' + MY_UID);
  const presenceSnap = await roomRef.child('presence').get();
  const existing = presenceSnap.val() || {};
  const otherAlready = Object.keys(existing).find(k => k !== MY_UID);
  // color: si ya hay alguien con cyan, tomo pink, y viceversa
  const takenColors = Object.values(existing).map(p=>p.color);
  MY_COLOR = takenColors.includes('cyan') ? 'pink' : 'cyan';

  presenceRef.set({ name: MY_NAME, color: MY_COLOR, online: true, ts: Date.now() });
  presenceRef.onDisconnect().update({ online: false });
  roomRef.child('cursors/' + MY_UID).onDisconnect().remove();

  $('lobby-code').textContent = code;
  showScreen('screen-lobby');

  roomRef.child('presence').on('value', snap => renderPresence(snap.val() || {}));

  // Si la sala ya tiene puzzle configurado, saltar directo al tablero
  roomRef.child('meta').on('value', snap => {
    const meta = snap.val();
    if(meta && meta.imageData && meta.seed && !window.__boardStarted){
      window.__boardStarted = true;
      startBoard(meta);
    }
    if(meta && meta.imageData){
      $('upload-preview').src = meta.imageData;
      $('upload-preview').classList.remove('hidden');
      $('upload-placeholder').classList.add('hidden');
    }
  });
}

function renderPresence(map){
  const html = Object.entries(map).map(([uid,p])=>{
    const mine = uid === MY_UID;
    const dotCls = p.online ? 'on' : 'off';
    const label = mine ? (p.name + ' (tú)') : p.name;
    const color = p.color === 'pink' ? 'var(--pink)' : 'var(--cyan)';
    return `<span class="presence-chip" style="border-color:${color}"><span class="dot ${dotCls}"></span>${label}</span>`;
  }).join('');
  $('lobby-presence').innerHTML = html;
  $('board-presence').innerHTML = html;
}

/* ============================================================
   LOBBY: UPLOAD + DIFFICULTY + START
============================================================ */
let selectedR = 4, selectedC = 6;
document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.onclick = () => {
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedR = +btn.dataset.r; selectedC = +btn.dataset.c;
  };
});

$('upload-zone').onclick = () => $('input-file').click();
$('input-file').onchange = async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const dataUrl = await resizeImageToDataUrl(file, 1000, 0.75);
  $('upload-preview').src = dataUrl;
  $('upload-preview').classList.remove('hidden');
  $('upload-placeholder').classList.add('hidden');
  window.__pendingImage = dataUrl;
};

function resizeImageToDataUrl(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = h*maxDim/w; w = maxDim; }
        else if(h >= w && h > maxDim){ w = w*maxDim/h; h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

$('btn-start-puzzle').onclick = async () => {
  const imageData = window.__pendingImage || $('upload-preview').src;
  if(!imageData || $('upload-preview').classList.contains('hidden')){
    alert('Sube primero una foto');
    return;
  }
  const meta = {
    imageData,
    rows: selectedR,
    cols: selectedC,
    seed: hashStr(ROOM_CODE + '_' + Date.now()),
    message: $('input-message').value.trim(),
    createdAt: Date.now()
  };
  await roomRef.child('meta').set(meta);
  // el listener de meta en enterRoom() se encargará de arrancar el tablero
};

/* ============================================================
   PUZZLE GENERATION (determinista — misma semilla = mismas piezas)
============================================================ */
function buildPuzzleModel(meta){
  const { rows, cols, seed } = meta;
  const pieceW = CANVAS_W / cols, pieceH = CANVAS_H / rows;
  const tabR = Math.min(pieceW, pieceH) * 0.18;
  const bleed = tabR * 2.4;

  const rnd = mulberry32(seed);
  const vSign = {}, hSign = {}; // divisores verticales/horizontales internos
  for(let r=0;r<rows;r++) for(let c=0;c<cols-1;c++) vSign[`${r}_${c}`] = rnd() < 0.5 ? 1 : -1;
  for(let r=0;r<rows-1;r++) for(let c=0;c<cols;c++) hSign[`${r}_${c}`] = rnd() < 0.5 ? 1 : -1;

  // RNG separado para el scatter inicial (para que no dependa del orden de lectura anterior)
  const rndScatter = mulberry32(seed + 777);

  const pieces = [];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const id = `p_${r}_${c}`;
      const edges = {
        top:    r===0        ? 0 : hSign[`${r-1}_${c}`],
        bottom: r===rows-1    ? 0 : hSign[`${r}_${c}`],
        left:   c===0        ? 0 : vSign[`${r}_${c-1}`],
        right:  c===cols-1    ? 0 : vSign[`${r}_${c}`],
      };
      const correctX = c * pieceW;
      const correctY = r * pieceH;
      const scatterX = 40 + rndScatter() * (CANVAS_W - pieceW - 80);
      const scatterY = 40 + rndScatter() * (CANVAS_H - pieceH - 80);
      pieces.push({
        id, row:r, col:c, correctX, correctY,
        initX: scatterX, initY: scatterY,
        pathLocal: buildPiecePath(pieceW, pieceH, tabR, bleed, edges),
        pieceW, pieceH, bleed,
        groupId: id // grupo propio al inicio
      });
    }
  }
  return { pieces, pieceW, pieceH, bleed, rows, cols };
}

function buildPiecePath(w, h, tabR, bleed, edges){
  const TL = {x:bleed, y:bleed};
  const TR = {x:bleed+w, y:bleed};
  const BR = {x:bleed+w, y:bleed+h};
  const BL = {x:bleed, y:bleed+h};

  function seg(p1, p2, sign){
    if(!sign) return `L ${p2.x} ${p2.y} `;
    const dx = p2.x-p1.x, dy = p2.y-p1.y;
    const len = Math.hypot(dx,dy);
    const ux = dx/len, uy = dy/len;
    const nx = uy, ny = -ux; // normal saliente para trazado en sentido horario
    const mid = { x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2 };
    const pre = { x: mid.x - ux*tabR, y: mid.y - uy*tabR };
    const post = { x: mid.x + ux*tabR, y: mid.y + uy*tabR };
    const ctrl = { x: mid.x + nx*sign*tabR*2.3, y: mid.y + ny*sign*tabR*2.3 };
    return `L ${pre.x} ${pre.y} Q ${ctrl.x} ${ctrl.y} ${post.x} ${post.y} L ${p2.x} ${p2.y} `;
  }

  let d = `M ${TL.x} ${TL.y} `;
  d += seg(TL, TR, edges.top);
  d += seg(TR, BR, edges.right);
  d += seg(BR, BL, edges.bottom);
  d += seg(BL, TL, edges.left);
  d += 'Z';
  return d;
}

/* ============================================================
   BOARD RUNTIME
============================================================ */
let MODEL = null;       // piezas deterministas base
let LIVE = {};          // overrides desde Firebase: {pieceId: {x,y,groupId,holder,holderName,holderColor}}
let zoom = 1;
let dragState = null;

function startBoard(meta){
  MODEL = buildPuzzleModel(meta);
  showScreen('screen-puzzle');

  const canvas = $('board-canvas');
  canvas.style.width = CANVAS_W + 'px';
  canvas.style.height = CANVAS_H + 'px';
  canvas.innerHTML = '';

  MODEL.pieces.forEach(p => {
    const el = document.createElement('div');
    el.className = 'piece';
    el.id = 'el_' + p.id;
    el.dataset.id = p.id;
    const totalW = p.pieceW + p.bleed*2, totalH = p.pieceH + p.bleed*2;
    el.style.width = totalW + 'px';
    el.style.height = totalH + 'px';
    el.style.backgroundImage = `url(${meta.imageData})`;
    el.style.backgroundSize = `${CANVAS_W}px ${CANVAS_H}px`;
    el.style.backgroundPosition = `-${p.correctX - p.bleed}px -${p.correctY - p.bleed}px`;
    el.style.clipPath = `path('${p.pathLocal}')`;
    el.style.zIndex = 1;
    el.addEventListener('pointerdown', (e)=>onPieceGrab(e, p.id));
    canvas.appendChild(el);
  });

  fitZoom();
  window.addEventListener('resize', fitZoom);

  roomRef.child('pieces').on('value', snap => {
    LIVE = snap.val() || {};
    renderAllPieces();
    updateProgress();
  });
  roomRef.child('cursors').on('value', snap => renderCursors(snap.val() || {}));

  $('board-viewport').addEventListener('pointermove', throttle(onViewportPointerMove, 45));
  $('board-viewport').addEventListener('pointerup', onPieceRelease);
  $('board-viewport').addEventListener('pointercancel', onPieceRelease);

  $('zoom-in').onclick = () => setZoom(zoom*1.2);
  $('zoom-out').onclick = () => setZoom(zoom/1.2);
  $('zoom-fit').onclick = fitZoom;
}

function pieceAbs(id){
  const base = MODEL.pieces.find(p=>p.id===id);
  const live = LIVE[id];
  return {
    x: live?.x ?? base.initX,
    y: live?.y ?? base.initY,
    groupId: live?.groupId ?? base.groupId,
    holder: live?.holder ?? null,
    holderName: live?.holderName ?? null,
    holderColor: live?.holderColor ?? null,
  };
}

function renderAllPieces(){
  MODEL.pieces.forEach(p=>{
    const el = $('el_' + p.id);
    if(!el) return;
    const abs = pieceAbs(p.id);
    el.style.transform = `translate(${abs.x - p.bleed}px, ${abs.y - p.bleed}px)`;
    el.style.zIndex = abs.holder ? 50 : 2;
    el.classList.toggle('held', !!abs.holder && abs.holder !== MY_UID);
    el.classList.toggle('mine-dragging', abs.holder === MY_UID);
    if(abs.holder && abs.holder !== MY_UID){
      el.style.setProperty('--holder-color', abs.holderColor === 'pink' ? 'var(--pink)' : 'var(--cyan)');
      let lbl = el.querySelector('.piece-label');
      if(!lbl){ lbl = document.createElement('div'); lbl.className='piece-label'; el.appendChild(lbl); }
      lbl.textContent = abs.holderName || '...';
      lbl.style.background = abs.holderColor === 'pink' ? 'var(--pink)' : 'var(--cyan)';
    } else {
      const lbl = el.querySelector('.piece-label');
      if(lbl) lbl.remove();
    }
  });
}

function groupMembers(groupId, allIds){
  return allIds.filter(id => pieceAbs(id).groupId === groupId);
}

/* ---------- Drag & drop ---------- */
function onPieceGrab(e, pieceId){
  e.stopPropagation();
  const abs = pieceAbs(pieceId);
  if(abs.holder && abs.holder !== MY_UID) return; // ya lo tiene el otro jugador

  const allIds = MODEL.pieces.map(p=>p.id);
  const members = groupMembers(abs.groupId, allIds);
  const rect = $('board-viewport').getBoundingClientRect();
  const startPointer = screenToCanvas(e.clientX, e.clientY, rect);

  dragState = {
    groupId: abs.groupId,
    members,
    startPointer,
    startPositions: Object.fromEntries(members.map(id=>{
      const a = pieceAbs(id);
      return [id, {x:a.x, y:a.y}];
    }))
  };

  members.forEach(id=>{
    const ref = roomRef.child('pieces/' + id);
    ref.update({ holder: MY_UID, holderName: MY_NAME, holderColor: MY_COLOR });
    ref.onDisconnect().update({ holder: null, holderName: null, holderColor: null });
  });
}

const pushPieceUpdate = throttle((id, x, y) => {
  roomRef.child('pieces/' + id).update({ x, y });
}, 55);

function onViewportPointerMove(e){
  const rect = $('board-viewport').getBoundingClientRect();
  const canvasPt = screenToCanvas(e.clientX, e.clientY, rect);

  // cursor propio -> broadcast
  roomRef.child('cursors/' + MY_UID).set({ x:canvasPt.x, y:canvasPt.y, name:MY_NAME, color:MY_COLOR });

  if(!dragState) return;
  const dx = canvasPt.x - dragState.startPointer.x;
  const dy = canvasPt.y - dragState.startPointer.y;
  dragState.members.forEach(id=>{
    const start = dragState.startPositions[id];
    const nx = start.x + dx, ny = start.y + dy;
    const el = $('el_' + id);
    const base = MODEL.pieces.find(p=>p.id===id);
    el.style.transform = `translate(${nx - base.bleed}px, ${ny - base.bleed}px)`;
    pushPieceUpdate(id, nx, ny);
  });
}

function screenToCanvas(clientX, clientY, viewportRect){
  return {
    x: (clientX - viewportRect.left) / zoom,
    y: (clientY - viewportRect.top) / zoom
  };
}

function onPieceRelease(){
  if(!dragState) return;
  const { members, groupId } = dragState;

  // liberar holder
  members.forEach(id=>{
    const ref = roomRef.child('pieces/' + id);
    ref.onDisconnect().cancel();
    ref.update({ holder: null, holderName: null, holderColor: null });
  });

  // comprobar snapping para cada pieza del grupo recién soltado
  const allIds = MODEL.pieces.map(p=>p.id);
  const SNAP_DIST = 22;
  let mergedInto = groupId;
  let totalDx = 0, totalDy = 0, snapped = false;

  for(const id of members){
    const piece = MODEL.pieces.find(p=>p.id===id);
    const abs = pieceAbs(id);
    const neighborsGrid = [
      [piece.row-1, piece.col], [piece.row+1, piece.col],
      [piece.row, piece.col-1], [piece.row, piece.col+1]
    ];
    for(const [nr,nc] of neighborsGrid){
      const neighbor = MODEL.pieces.find(p=>p.row===nr && p.col===nc);
      if(!neighbor) continue;
      const nAbs = pieceAbs(neighbor.id);
      if(nAbs.groupId === abs.groupId) continue; // ya en el mismo grupo
      const expectedDx = neighbor.correctX - piece.correctX;
      const expectedDy = neighbor.correctY - piece.correctY;
      const actualDx = nAbs.x - abs.x;
      const actualDy = nAbs.y - abs.y;
      if(Math.abs(actualDx-expectedDx) < SNAP_DIST && Math.abs(actualDy-expectedDy) < SNAP_DIST){
        totalDx = (nAbs.x - expectedDx) - abs.x;
        totalDy = (nAbs.y - expectedDy) - abs.y;
        mergedInto = nAbs.groupId;
        snapped = true;
        break;
      }
    }
    if(snapped) break;
  }

  if(snapped){
    const updates = {};
    // corrige posición de todo el grupo que se acaba de soltar
    members.forEach(id=>{
      const abs = pieceAbs(id);
      updates['pieces/'+id+'/x'] = abs.x + totalDx;
      updates['pieces/'+id+'/y'] = abs.y + totalDy;
      updates['pieces/'+id+'/groupId'] = mergedInto;
    });
    roomRef.update(updates);
  }

  dragState = null;
}

/* ---------- Cursors ---------- */
function renderCursors(map){
  const layer = $('cursors-layer');
  Object.entries(map).forEach(([uid, c])=>{
    if(uid === MY_UID) return;
    let el = document.getElementById('cur_' + uid);
    if(!el){
      el = document.createElement('div');
      el.className = 'cursor';
      el.id = 'cur_' + uid;
      el.innerHTML = `<div style="width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${c.color==='pink'?'var(--pink)':'var(--cyan)'}"></div><span class="cursor-tag" style="background:${c.color==='pink'?'var(--pink)':'var(--cyan)'}">${c.name}</span>`;
      layer.appendChild(el);
    }
    el.style.left = c.x + 'px';
    el.style.top = c.y + 'px';
  });
  // limpiar cursores desconectados
  [...layer.children].forEach(el=>{
    const uid = el.id.replace('cur_','');
    if(!map[uid]) el.remove();
  });
}

/* ---------- Progress / completion ---------- */
function updateProgress(){
  const allIds = MODEL.pieces.map(p=>p.id);
  const counts = {};
  allIds.forEach(id=>{
    const g = pieceAbs(id).groupId;
    counts[g] = (counts[g]||0) + 1;
  });
  const maxGroup = Math.max(...Object.values(counts));
  const total = allIds.length;
  $('progress-pill').textContent = `${maxGroup}/${total} piezas`;

  if(maxGroup === total && !window.__completed){
    window.__completed = true;
    celebrateCompletion();
  }
}

function celebrateCompletion(){
  roomRef.child('meta').get().then(snap=>{
    const meta = snap.val();
    $('reveal-img').src = meta.imageData;
    $('reveal-msg').textContent = meta.message || '¡Lo habéis conseguido juntos! 🧩❤️';
    $('reveal-overlay').style.display = 'flex';
    launchConfetti();
  });
}

function launchConfetti(){
  const colors = ['#5eead4','#f472b6','#fbbf24','#a78bfa'];
  for(let i=0;i<80;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    const size = 6 + Math.random()*6;
    el.style.width = size+'px'; el.style.height = size*0.4+'px';
    el.style.background = colors[i%colors.length];
    el.style.left = Math.random()*100+'vw';
    el.style.opacity = 0.9;
    document.body.appendChild(el);
    const duration = 2500 + Math.random()*2000;
    const rotate = Math.random()*720-360;
    el.animate([
      { transform:`translateY(0) rotate(0deg)`, opacity:1 },
      { transform:`translateY(100vh) rotate(${rotate}deg)`, opacity:0.2 }
    ], { duration, easing:'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => el.remove();
  }
}

/* ---------- Zoom ---------- */
function setZoom(z){
  zoom = Math.min(2.5, Math.max(0.3, z));
  $('board-canvas').style.transform = `scale(${zoom})`;
  $('cursors-layer').style.transform = `scale(${zoom})`;
  $('cursors-layer').style.transformOrigin = '0 0';
}
function fitZoom(){
  const vp = $('board-viewport').getBoundingClientRect();
  const z = Math.min(vp.width / CANVAS_W, vp.height / CANVAS_H) * 0.94;
  setZoom(z);
}
</script>
